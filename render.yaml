# render.yaml – Render Infrastructure-as-Code (Blueprint)
# Deploy both services from one repo: https://render.com/docs/blueprint-spec

services:
  # ── Backend (FastAPI + YOLO) ───────────────────────────────────────────
  - type: web
    name: headcount-api
    runtime: python
    region: oregon
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.4"
    autoDeploy: true

  # ── Frontend (Vite + React static site) ────────────────────────────────
  - type: web
    name: headcount-app
    runtime: static
    region: oregon
    plan: free
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        value: https://headcount-api.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    autoDeploy: true
